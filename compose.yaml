# Newxr with PostgreSQL.  cp .env.example .env, set POSTGRES_PASSWORD, then:  docker compose up -d
# Open http://localhost:8080 (or NEWXR_PORT). The one-time setup key is in `docker compose logs newxr`.

services:
  newxr:
    build: .
    image: newxr:latest
    restart: unless-stopped
    ports:
      - "${NEWXR_PORT:-8080}:8080"
    environment:
      NEWXR_PUBLIC_URL: ${NEWXR_PUBLIC_URL:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-newxr}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-newxr}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - newxr-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newxr}
      POSTGRES_USER: ${POSTGRES_USER:-newxr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  newxr-data:
  postgres-data:
